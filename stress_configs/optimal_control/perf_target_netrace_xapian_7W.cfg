// Performance-Target: xapian netrace workload, 7W cap (tight), 2-class priority

read_request_begin_vc  = 0;
read_request_end_vc    = 5;
write_reply_begin_vc   = 2;
write_reply_end_vc     = 7;
read_reply_begin_vc    = 8;
read_reply_end_vc      = 12;
write_request_begin_vc = 10;
write_request_end_vc   = 15;
num_vcs     = 16;
vc_buf_size = 8;
wait_for_tail_credit = 0;
vc_allocator = max_size;
sw_allocator = max_size;
alloc_iters  = 2;
credit_delay   = 2;
routing_delay  = 0;
vc_alloc_delay = 1;
sw_alloc_delay = 1;
st_final_delay = 1;
input_speedup     = 1;
output_speedup    = 1;
internal_speedup  = 1.0;

sim_type = latency;
warmup_periods = 0;
sim_count = 1;
topology = flatfly;
subnets = 1;
c  = 4;
k  = 4;
n  = 2;
x  = 4;
y  = 4;
xr = 2;
yr = 2;
limit = 64;
routing_function = ran_min;
sample_period  = 1000;
max_samples = 50;

// Class configuration
classes = 2;
class_priority = {1,0};
class_slo = {50,-1};
class_priority_boost = {1.0,1.0};
priority_policy = static_class;

// Netrace setup
use_netrace = 1;
netrace_file = ../../sniper_trace_to_netrace/workloads/xapian_trace_3.log.tra.bz2;
netrace_region = 0;
netrace_ignore_deps = 0;
netrace_scale = 1;
netrace_use_addr_size = 1;
netrace_class_from_node_types = 1;
netrace_class = 0;

// Dummy values
traffic = uniform;
injection_rate = 0.01;
injection_process = bernoulli;
packet_size = 1;

use_orion = 1;
Vdd = 1.0;
Orion_tr = 0.2;
Orion_Freq = 1e9;
Orion_inport = 5;
Orion_outport = 5;
Orion_bitwidth = 128;
Orion_vc_class = 1;
Orion_IsSharedBuffIn = 0;
Orion_IsSharedBuffOut = 0;
Orion_crossbar_model = 0;
Orion_crsbar_degree = 4;
Orion_Cxbar_Cxpoint = 0;
Orion_trans_type = 0;
Orion_IsInBuff = 1;
Orion_out_buf_size = 0;
Orion_IsOutBuff = 0;
Orion_buff_type = 0;
Orion_in_arb_model = 1;
Orion_out_arb_model = 1;
Orion_allocator_model = 1;
Orion_in_vc_arb_model = 1;
Orion_out_vc_arb_model = 1;
wire_length = 1.0;

// Performance-Target DVFS with tight power cap
dvfs_policy = perf_target;
dvfs_epoch = 10000;
dvfs_log_interval = 10000;
power_cap = 7.0;
dvfs_min_scale = 0.5;
dvfs_max_scale = 1.0;
perf_target_metric = latency;
perf_target_value = 50;
perf_target_class = 0;
perf_target_kp = 0.08;
perf_target_per_router = 0;
perf_target_headroom_margin = 0.1;
router_domains = 0;

latency_csv = latency.csv;
stall_csv = stalls.csv;
throughput_csv = throughput.csv;
summary_csv = summary.csv;
energy_csv = energy.csv;
epoch_csv = epoch.csv;
dvfs_log = power_log;
output_dir = ../sims/stress_tests;
run_name = perf_target_netrace_xapian_7W;
