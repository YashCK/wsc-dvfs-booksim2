// Example BookSim config that drives netrace traces with per-packet class/size.
// Adjust paths and topology as needed for your test.

///////////////////BEGIN IMMUTABLE////////////////////////////////
// Flow control (matching flatflyconfig)
read_request_begin_vc  = 0;
read_request_end_vc    = 5;
write_reply_begin_vc   = 2;
write_reply_end_vc     = 7;
read_reply_begin_vc    = 8;
read_reply_end_vc      = 12;
write_request_begin_vc = 10;
write_request_end_vc   = 15;

// Total number of VCs must match the above assignments
num_vcs     = 16;
vc_buf_size = 8;

wait_for_tail_credit = 0;

// Router architecture
vc_allocator = max_size;
sw_allocator = max_size;
alloc_iters  = 2;

credit_delay   = 2;
routing_delay  = 0;
vc_alloc_delay = 1;
sw_alloc_delay = 1;
st_final_delay = 1;

input_speedup     = 1;
output_speedup    = 1;
internal_speedup  = 1.0;
///////////////////END IMMUTABLE////////////////////////////////

// Topology (64 nodes)
topology = flatfly;
subnets = 1;
c  = 4;
k  = 4;
n  = 2;
x  = 4;
y  = 4;
xr = 2;
yr = 2;
limit = 64;

// Routing
routing_function = ran_min;

// Classes and priorities
classes = 2;
class_priority = {1,0};
class_slo = {-1,-1};
class_priority_boost = {1.0,1.0};

// DVFS/policies (optional)
priority_policy = static_class;
dvfs_policy = uniform;
dvfs_epoch = 0;

// Netrace setup
use_netrace = 1;
// Path to your generated trace; relative to this file
netrace_file = ../../sniper_trace_to_netrace/workloads/fft_trace.tra.bz2;
netrace_region = 0;
netrace_ignore_deps = 0;
netrace_scale = 1;
// Use per-packet size from addr field
netrace_use_addr_size = 1;
// Use per-packet class from node_types (field 6 in our converter)
netrace_class_from_node_types = 1;
// Fallback class if out of range
netrace_class = 0;

// Traffic/injection settings are ignored when use_netrace=1, but must be present
sim_type = latency;
warmup_periods = 0;
sample_period  = 1000;
sim_count      = 1;
traffic       = uniform;
injection_rate = 0.01;
injection_process = bernoulli;
packet_size = 1;

// Misc
print_activity = 0;
viewer_trace = 0;
