// Mesh baseline: FFT netrace workload, 10W cap

read_request_begin_vc  = 0;
read_request_end_vc    = 5;
write_reply_begin_vc   = 2;
write_reply_end_vc     = 7;
read_reply_begin_vc    = 8;
read_reply_end_vc      = 12;
write_request_begin_vc = 10;
write_request_end_vc   = 15;
num_vcs     = 16;
vc_buf_size = 8;
wait_for_tail_credit = 0;
vc_allocator = max_size;
sw_allocator = max_size;
alloc_iters  = 2;
credit_delay   = 2;
routing_delay  = 0;
vc_alloc_delay = 1;
sw_alloc_delay = 1;
st_final_delay = 1;
input_speedup     = 1;
output_speedup    = 1;
internal_speedup  = 1.0;

sim_type = latency;
warmup_periods = 0;
sim_count = 1;

// 8x8 Mesh: 64 routers, 64 nodes (no concentration)
topology = mesh;
k  = 8;
n  = 2;

routing_function = dor;
sample_period  = 1000;
max_samples = 50;

// Netrace setup - FFT workload
use_netrace = 1;
netrace_file = ../../sniper_trace_to_netrace/workloads/network_trace_fft.log.tra.bz2;
netrace_region = 0;
netrace_ignore_deps = 0;
netrace_scale = 1;
netrace_use_addr_size = 1;
netrace_class = 0;

// Dummy values for synthetic (ignored with netrace)
traffic = uniform;
injection_rate = 0.01;
injection_process = bernoulli;
packet_size = 1;

use_orion = 1;
Vdd = 1.0;
Orion_tr = 0.2;
Orion_Freq = 1e9;
Orion_inport = 5;
Orion_outport = 5;
Orion_bitwidth = 128;
Orion_vc_class = 1;
Orion_IsSharedBuffIn = 0;
Orion_IsSharedBuffOut = 0;
Orion_crossbar_model = 0;
Orion_crsbar_degree = 4;
Orion_Cxbar_Cxpoint = 0;
Orion_trans_type = 0;
Orion_IsInBuff = 1;
Orion_out_buf_size = 0;
Orion_IsOutBuff = 0;
Orion_buff_type = 0;
Orion_in_arb_model = 1;
Orion_out_arb_model = 1;
Orion_allocator_model = 1;
Orion_in_vc_arb_model = 1;
Orion_out_vc_arb_model = 1;
wire_length = 1.0;

dvfs_policy = static;
dvfs_epoch = 10000;
dvfs_log_interval = 10000;
power_cap = 10.0;
dvfs_freqs = 1.0;
dvfs_voltages = 1.0;
output_dir = ../sims/mesh_stress_tests;
