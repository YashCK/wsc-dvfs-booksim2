// 2-Class Priority-Aware Test Config for DVFS Policy Comparison
// Class 0 = Control (high priority), Class 1 = Batch (low priority)
// Purpose: Compare uniform < hw_reactive < queue_pid < perf_target for control P99

sim_type = latency;
topology = flatfly;
routing_function = ran_min;
c = 4;
k = 4;
n = 2;
x = 4;
y = 4;
xr = 2;
yr = 2;
subnets = 1;
num_vcs = 16;
vc_buf_size = 8;
vc_allocator = max_size;
sw_allocator = max_size;
alloc_iters = 2;
credit_delay = 2;
routing_delay = 0;
vc_alloc_delay = 1;
sw_alloc_delay = 1;
st_final_delay = 1;
input_speedup = 1;
output_speedup = 1;
internal_speedup = 1.0;
warmup_periods = 3;
sim_count = 1;
sample_period = 10000;
max_samples = 15;
latency_thres = 5000;

// 2-class traffic configuration
classes = 2;
traffic = uniform;

// Injection rates: Class 0 (control) = 10%, Class 1 (batch) = 25%
// Total ~35% load which is moderate
injection_rate = {0.10,0.25};

// Priority: Class 0 gets higher priority (1 > 0)
class_priority = {1,0};

// SLO: Control class target 50 cycles, batch has no SLO
class_slo = {50,-1};
class_priority_boost = {1.0,1.0};
priority_policy = static_class;
packet_size = 1;

// Power model
use_orion = 1;
Vdd = 1.0;
Orion_tr = 0.2;
Orion_Freq = 1e9;
Orion_inport = 5;
Orion_outport = 5;
Orion_bitwidth = 128;
Orion_vc_class = 1;
Orion_IsSharedBuffIn = 0;
Orion_IsSharedBuffOut = 0;
Orion_crossbar_model = 0;
Orion_crsbar_degree = 4;
Orion_Cxbar_Cxpoint = 0;
Orion_trans_type = 0;
Orion_IsInBuff = 1;
Orion_out_buf_size = 0;
Orion_IsOutBuff = 0;
Orion_buff_type = 0;
Orion_in_arb_model = 1;
Orion_out_arb_model = 1;
Orion_allocator_model = 1;
Orion_in_vc_arb_model = 1;
Orion_out_vc_arb_model = 1;
wire_length = 1.0;

// DVFS Common Settings (will be overridden per policy)
dvfs_policy = static;
dvfs_epoch = 10000;
dvfs_log_interval = 10000;
power_cap = 0.6;
dvfs_min_scale = 0.5;
dvfs_max_scale = 1.0;
router_domains = 0;

// Control class configuration (for class-aware policies)
control_class_id = 0;

// HW-Reactive settings
hw_reactive_signal = queue;
hw_reactive_high_thresh = 0.05;
hw_reactive_low_thresh = 0.01;
hw_reactive_high_scale = 1.0;
hw_reactive_low_scale = 0.7;
hw_reactive_hysteresis_epochs = 1;
hw_reactive_per_router = 0;
hw_reactive_headroom_margin = 0.0;

// Class-aware settings (shared by hw_reactive and queue_pid)
control_class_id = 0;
control_slo_cycles = 40.0;

// Queue-PID settings
queue_pid_target = 0.02;
queue_pid_kp = 5.0;
queue_pid_ki = 0.0;
queue_pid_kd = 0.0;
queue_pid_per_router = 0;
queue_pid_headroom_margin = 0.0;

// Perf-Target settings
perf_target_metric = latency;
perf_target_value = 50;
perf_target_class = 0;
perf_target_kp = 0.1;
perf_target_per_router = 0;
perf_target_headroom_margin = 0.0;

run_name = policy_comparison_test;
