// FlatFly with Orion + DVFS budget policy example

// Base router/traffic settings (adapted from flatflyconfig)
read_request_begin_vc  = 0;
read_request_end_vc    = 5;
write_reply_begin_vc   = 2;
write_reply_end_vc     = 7;
read_reply_begin_vc    = 8;
read_reply_end_vc      = 12;
write_request_begin_vc = 10;
write_request_end_vc   = 15;
num_vcs     = 16;
vc_buf_size = 8;
wait_for_tail_credit = 0;
vc_allocator = max_size;
sw_allocator = max_size;
alloc_iters  = 2;
credit_delay   = 2;
routing_delay  = 0;
vc_alloc_delay = 1;
sw_alloc_delay = 1;
st_final_delay = 1;
input_speedup     = 1;
output_speedup    = 1;
internal_speedup  = 1.0;
sim_type = latency;
warmup_periods = 3;
sim_count = 1;
topology = flatfly;
subnets = 1;
c  = 4;
k  = 4;
n  = 2;
x  = 4;
y  = 4;
xr = 2;
yr = 2;
limit = 64;
routing_function = ran_min;
packet_size = 1;
traffic       = uniform;
sample_period  = 10000;
use_read_write = 0;
batch_size = 10000;
injection_rate = 0.6;

// Orion power modeling
use_orion = 1;
Vdd = 1.0;
Orion_tr = 0.2;
Orion_Freq = 1e9;
Orion_inport = 5;
Orion_outport = 5;
Orion_bitwidth = 128;
Orion_vc_class = 1;
Orion_IsSharedBuffIn = 0;
Orion_IsSharedBuffOut = 0;
Orion_crossbar_model = 0;
Orion_crsbar_degree = 4;
Orion_Cxbar_Cxpoint = 0;
Orion_trans_type = 0;
Orion_IsInBuff = 1;
Orion_out_buf_size = 0;
Orion_IsOutBuff = 0;
Orion_buff_type = 0;
Orion_in_arb_model = 1;
Orion_out_arb_model = 1;
Orion_allocator_model = 1;
Orion_in_vc_arb_model = 1;
Orion_out_vc_arb_model = 1;

// DVFS settings
dvfs_epoch = 10000;
dvfs_policy = budget;
power_cap = 10.0;
dvfs_freqs = 1.0;
dvfs_voltages = 1.0;
dvfs_log = power_log;
router_domains = 0;

// CSV outputs
latency_csv = latency.csv;
stall_csv = stalls.csv;
throughput_csv = throughput.csv;
output_dir = ../sims;
run_name = flatfly_dvfs_orion;
