// FlatFly with hardware-reactive DVFS example

// Base router/traffic settings (adapted from flatflyconfig)
read_request_begin_vc  = 0;
read_request_end_vc    = 5;
write_reply_begin_vc   = 2;
write_reply_end_vc     = 7;
read_reply_begin_vc    = 8;
read_reply_end_vc      = 12;
write_request_begin_vc = 10;
write_request_end_vc   = 15;
num_vcs     = 16;
vc_buf_size = 8;
wait_for_tail_credit = 0;
vc_allocator = max_size;
sw_allocator = max_size;
alloc_iters  = 2;
credit_delay   = 2;
routing_delay  = 0;
vc_alloc_delay = 1;
sw_alloc_delay = 1;
st_final_delay = 1;
input_speedup     = 1;
output_speedup    = 1;
internal_speedup  = 1.0;
sim_type = latency;
warmup_periods = 3;
sim_count = 1;
topology = flatfly;
subnets = 1;
c  = 4;
k  = 4;
n  = 2;
x  = 4;
y  = 4;
xr = 2;
yr = 2;
limit = 64;
routing_function = ran_min;
packet_size = 1;
traffic       = uniform;
sample_period  = 10000;
max_samples = 20;
use_read_write = 0;
batch_size = 10000;
injection_rate = 0.6;
latency_thres = 2000;

// Orion power modeling
use_orion = 1;
Vdd = 1.0;
Orion_tr = 0.2;
Orion_Freq = 1e9;
Orion_inport = 5;
Orion_outport = 5;
Orion_bitwidth = 128;
Orion_vc_class = 1;
Orion_IsSharedBuffIn = 0;
Orion_IsSharedBuffOut = 0;
Orion_crossbar_model = 0;
Orion_crsbar_degree = 4;
Orion_Cxbar_Cxpoint = 0;
Orion_trans_type = 0;
Orion_IsInBuff = 1;
Orion_out_buf_size = 0;
Orion_IsOutBuff = 0;
Orion_buff_type = 0;
Orion_in_arb_model = 1;
Orion_out_arb_model = 1;
Orion_allocator_model = 1;
Orion_in_vc_arb_model = 1;
Orion_out_vc_arb_model = 1;
wire_length = 1.0;

// DVFS settings: hardware-reactive FIXED
// KEY INSIGHT: At injection_rate=0.6, queue occupancy is very low (~1%)
// because the network is not congested - buffers drain quickly.
// We need to use a MUCH LOWER threshold to avoid unnecessary throttling.
// 
// Alternative: Don't use reactive DVFS at this load - it's counterproductive.
// The network needs ~100% speed to handle 0.6 injection rate.
//
// This config keeps frequency at 0.95-1.0x range for stability
dvfs_policy = hw_reactive;
dvfs_epoch = 10000;
dvfs_log_interval = 10000;
power_cap = 10.0;
dvfs_freqs = 1.0;
dvfs_voltages = 1.0;
dvfs_min_scale = 0.95;  // VERY CONSERVATIVE: only drop to 95%
dvfs_max_scale = 1.0;
hw_reactive_signal = queue;
hw_reactive_high_thresh = 0.05;  // Boost to 1.0x if occupancy > 5%
hw_reactive_low_thresh  = 0.005; // Drop to 0.95x only if occupancy < 0.5%
hw_reactive_high_scale  = 1.0;
hw_reactive_low_scale   = 0.95;
hw_reactive_hysteresis_epochs = 3;  // Avoid rapid changes
hw_reactive_per_router = 0;
router_domains = 0;

dvfs_log = power_log;

// Outputs
latency_csv = latency.csv;
stall_csv = stalls.csv;
throughput_csv = throughput.csv;
summary_csv = summary.csv;
energy_csv = energy.csv;
epoch_csv = epoch.csv;
output_dir = ../sims;
run_name = flatfly_hw_reactive;
