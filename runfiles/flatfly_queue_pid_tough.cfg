sim_type = latency
topology = flatfly
c = 4; k = 4; n = 2; x = 4; y = 4; xr = 2; yr = 2
subnets = 1
num_vcs = 16
vc_buf_size = 8
vc_allocator = max_size
sw_allocator = max_size
alloc_iters = 2
credit_delay = 2
routing_delay = 0
vc_alloc_delay = 1
sw_alloc_delay = 1
st_final_delay = 1
input_speedup = 1
output_speedup = 1
internal_speedup = 1.0
warmup_periods = 3
sim_count = 1
sample_period = 10000
max_samples = 20
traffic = uniform
packet_size = 1
injection_rate = 0.6
latency_thres = 2000

# Orion
use_orion = 1
Vdd = 1.0
Orion_tr = 0.2
Orion_Freq = 1e9
Orion_inport = 5
Orion_outport = 5
Orion_bitwidth = 128
Orion_vc_class = 1
Orion_IsSharedBuffIn = 0
Orion_IsSharedBuffOut = 0
Orion_crossbar_model = 0
Orion_crsbar_degree = 4
Orion_Cxbar_Cxpoint = 0
Orion_trans_type = 0
Orion_IsInBuff = 1
Orion_out_buf_size = 0
Orion_IsOutBuff = 0
Orion_buff_type = 0
Orion_in_arb_model = 1
Orion_out_arb_model = 1
Orion_allocator_model = 1
Orion_in_vc_arb_model = 1
Orion_out_vc_arb_model = 1
wire_length = 1.0

# DVFS queue-PID (tougher: lower floor, smaller target)
dvfs_policy = queue_pid
dvfs_epoch = 10000
dvfs_log_interval = 10000
power_cap = 10.0
dvfs_min_scale = 0.9
dvfs_max_scale = 1.0
queue_pid_target = 0.01      # aim for ~1% occupancy
queue_pid_kp = 0.05          # small proportional step
queue_pid_ki = 0.0
queue_pid_kd = 0.0
queue_pid_per_router = 0     # per-domain control
queue_pid_headroom_margin = 0.0

latency_csv = latency.csv
stall_csv = stalls.csv
throughput_csv = throughput.csv
summary_csv = summary.csv
energy_csv = energy.csv
epoch_csv = epoch.csv
dvfs_log = power_log
output_dir = ../sims
run_name = flatfly_queue_pid_tough
